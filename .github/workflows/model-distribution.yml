name: Model distribution tests

on:
  pull_request:
    paths:
      - "sigid/model_distribution.py"
      - "sigid/api.py"
      - "tests/test_model_distribution.py"
      - "scripts/publish_model_release.sh"
      - ".github/workflows/model-distribution.yml"
  push:
    branches: [main]
    paths:
      - "sigid/model_distribution.py"
      - "sigid/api.py"
      - "tests/test_model_distribution.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-model-distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"
      - name: Verify bundle validation, checksum handling and first-run fallbacks
        run: python -m pytest -q tests/test_model_distribution.py
      - name: Compile model distribution module
        run: python -m compileall -q sigid/model_distribution.py
