name: Identification chain tests

on:
  pull_request:
    paths:
      - "sigid/identification.py"
      - "sigid/classifier.py"
      - "sigid/api.py"
      - "sigid/tracking.py"
      - "sigid/web/app.js"
      - "sigid/web/index.html"
      - "sigid/web/style.css"
      - "tests/test_api.py"
      - "sigid/dataset.py"
      - "tests/test_identification.py"
      - "tests/test_classifier_api.py"
      - "tests/test_tracking.py"
      - ".github/workflows/identification-chain.yml"
  push:
    branches:
      - feature/evidence-guided-identification

jobs:
  identification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev,api]"
      - name: Test evidence and existing classifier flows
        run: python -m pytest -q tests/test_identification.py tests/test_classifier_api.py tests/test_tracking.py tests/test_api.py
      - name: Check live browser JavaScript syntax
        run: node --input-type=module --check < sigid/web/app.js
