name: Identification chain tests

on:
  pull_request:
    paths:
      - "sigid/identification.py"
      - "sigid/libsigdecode/**"
      - "sigid/signal_lab.py"
      - "tests/test_signal_lab.py"
      - "docs/SIGNAL_LAB.md"
      - "sigid/local_decoder_backend.py"
      - "sigid/native_live_decode.py"
      - "sigid/live_classifier_cache.py"
      - "sigid/web/live-candidate-history.mjs"
      - "tests/test_live_classifier_cache.py"
      - "tests/test_live_candidate_history.mjs"
      - "tools/bench_live_pipeline.py"
      - "docs/LIVE_PIPELINE_OPTIMIZATION.md"
      - "tests/test_native_live_decode.py"
      - "tests/test_native_live_api.py"
      - "docs/NATIVE_LIVE_DECODING.md"
      - "sigid/conformance.py"
      - "tests/test_decoder_conformance.py"
      - "tests/fixtures/decoder_conformance/**"
      - "tools/build_decoder_conformance_cw_fixtures.py"
      - "tools/build_decoder_conformance_rtty_fixtures.py"
      - "tools/build_decoder_conformance_bpsk31_fixtures.py"
      - "tests/test_decode_*.py"
      - "tests/test_decoder_conformance_*.py"
      - "tests/test_native_mode_integration.py"
      - "docs/DECODER_CONFORMANCE.md"
      - "tests/test_libsigdecode.py"
      - "tests/test_decoder_contract_docs.py"
      - "docs/DECODER_API_SPEC.md"
      - "docs/DECODER_AGENT_PLAYBOOK.md"
      - "docs/DECODER_EVIDENCE_INDEX.md"
      - "docs/decoder-work-items.json"
      - "docs/decoder-evidence/**"
      - "docs/schemas/**"
      - "sigid/timing_evidence.py"
      - "sigid/onair_backend.py"
      - "tests/test_onair_backend.py"
      - "tests/test_timing_evidence.py"
      - "tests/test_timing_evidence_api.py"
      - "tests/test_narrow_tone_detection.py"
      - "sigid/frequency_refinement.py"
      - "sigid/crowded_benchmark.py"
      - "pyproject.toml"
      - "tests/test_frequency_refinement.py"
      - "tests/test_crowded_benchmark.py"
      - "tests/test_frequency_refinement_api.py"
      - "sigid/classifier.py"
      - "sigid/api.py"
      - "sigid/tracking.py"
      - "sigid/web/time-lens.mjs"
      - "tests/test_time_lens.mjs"
      - "docs/WATERFALL_TIME_LENS.md"
      - "sigid/web/app.js"
      - "sigid/web/index.html"
      - "sigid/web/style.css"
      - "tests/test_api.py"
      - "sigid/dataset.py"
      - "tests/test_identification.py"
      - "tests/test_classifier_api.py"
      - "tests/test_tracking.py"
      - ".github/workflows/identification-chain.yml"
  push:
    branches:
      - feature/evidence-guided-identification

jobs:
  identification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev,api]"
      - name: Test evidence and existing classifier flows
        run: python -m pytest -q tests/test_identification.py tests/test_classifier_api.py tests/test_tracking.py tests/test_api.py tests/test_frequency_refinement.py tests/test_crowded_benchmark.py tests/test_frequency_refinement_api.py tests/test_timing_evidence.py tests/test_timing_evidence_api.py tests/test_narrow_tone_detection.py tests/test_onair_backend.py tests/test_libsigdecode.py tests/test_decoder_contract_docs.py tests/test_decoder_conformance.py tests/test_decode_rtty.py tests/test_decode_bpsk31.py tests/test_decode_ax25.py tests/test_decoder_conformance_rtty.py tests/test_decoder_conformance_bpsk31.py tests/test_decoder_conformance_ax25.py tests/test_native_mode_integration.py tests/test_native_live_decode.py tests/test_native_live_api.py tests/test_live_classifier_cache.py
      - name: Run pinned CW decoder positive and negative suite
        run: python -m sigid.conformance tests/fixtures/decoder_conformance/cw/manifest.json --json-out /tmp/cw-conformance.json
      - name: Run pinned native-mode conformance suites
        run: |
          python -m sigid.conformance tests/fixtures/decoder_conformance/rtty/manifest.json --json-out /tmp/rtty-conformance.json
          python -m sigid.conformance tests/fixtures/decoder_conformance/bpsk31/manifest.json --json-out /tmp/bpsk31-conformance.json
          python -m sigid.conformance tests/fixtures/decoder_conformance/ax25/manifest.json --json-out /tmp/ax25-conformance.json
      - name: Verify synthetic multi-modem signal lab
        run: python -m pytest -q tests/test_signal_lab.py
      - name: Verify decoder UI JavaScript tests
        run: node --test tests/test_decoder_result.mjs tests/test_decoder_artifact_ui.mjs tests/test_decoder_mode_suggestions.mjs tests/test_time_lens.mjs tests/test_live_waterfall.mjs tests/test_signal_overlays.mjs tests/test_live_candidate_history.mjs
      - name: Check live browser JavaScript syntax
        run: node --input-type=module --check < sigid/web/app.js
