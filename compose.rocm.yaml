services:
  workbench:
    build:
      context: .
      dockerfile: Dockerfile.rocm
      args:
        ROCM_PYTORCH_IMAGE: ${SIG_ID_ROCM_PYTORCH_IMAGE:-rocm/pytorch:rocm10.1.0_ubuntu24.04_py3.12_pytorch_release_2.13.0@sha256:b11c021675620aa82d1eaa2d1e78387dde7521bb5b972ce0ad47b6b004d4e7aa}
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "${SIG_ID_ROCM_VIDEO_GID:-44}"
      - "${SIG_ID_ROCM_RENDER_GID:-110}"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    shm_size: ${SIG_ID_ROCM_SHM_SIZE:-8g}
