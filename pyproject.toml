[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sig-id"
version = "0.1.0"
description = "Digital radio signal identification and decoding workbench"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
audio = ["numpy>=2.0", "scipy>=1.13", "soundfile>=0.12", "sounddevice>=0.5"]
api = ["fastapi>=0.111", "uvicorn>=0.30"]
dev = ["pytest>=8"]

[project.scripts]
sig-id-probe-fldigi = "sigid.fldigi_probe:main"

[tool.setuptools.packages.find]
include = ["sigid*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
