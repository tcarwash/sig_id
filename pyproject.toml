[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sig-id"
version = "0.1.0"
description = "Digital radio signal identification and decoding workbench"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
audio = ["numpy>=2.0", "scipy>=1.13", "soundfile>=0.12", "sounddevice>=0.5"]
api = ["fastapi>=0.111", "uvicorn>=0.30", "python-multipart>=0.0.9", "numpy>=2.0", "scipy>=1.13"]
dev = ["pytest>=8", "fastapi>=0.111", "httpx>=0.27", "numpy>=2.0", "python-multipart>=0.0.9", "uvicorn>=0.30", "scipy>=1.13"]
cv = ["ultralytics>=8.4"]

[project.scripts]
sig-id-probe-fldigi = "sigid.fldigi_probe:main"
sig-id-generate-2fsk = "sigid.synthetic:main"
sig-id-generate-mfsk = "sigid.synthetic:mfsk_main"
sig-id-generate-bpsk = "sigid.synthetic:bpsk_main"
sig-id-generate-qpsk = "sigid.synthetic:qpsk_main"
sig-id-generate-ook = "sigid.synthetic:ook_main"
sig-id-generate-ask = "sigid.synthetic:ask_main"
sig-id-generate-ppm = "sigid.synthetic:ppm_main"
sig-id-augment-awgn = "sigid.augmentation:main"
sig-id-build-corpus = "sigid.corpus:main"
sig-id-split-corpus = "sigid.splits:main"
sig-id-train-method-model = "sigid.training:main"
sig-id-evaluate-split-seeds = "sigid.seed_evaluation:main"
sig-id-evaluate-ood = "sigid.ood_evaluation:main"
sig-id-build-ood-corpus = "sigid.ood_corpus:main"
sig-id-import-synthetic = "sigid.synthetic_dataset:main"
sig-id-mix-scene = "sigid.scenes:create_main"
sig-id-import-scene = "sigid.scenes:import_main"
sig-id-evaluate-detector = "sigid.detection_evaluation:main"
sig-id-export-cv-dataset = "sigid.cv_dataset:main"
sig-id-train-cv-detector = "sigid.cv_training:main"
sig-id-build-cv-embedding-index = "sigid.cv_embeddings:main"
sig-id-import-sigidwiki = "sigid.sigidwiki:main"
sig-id-serve = "sigid.server:main"
sig-id-hub = "sigid.hub:main"

[tool.setuptools.package-data]
sigid = ["web/*.html", "web/*.js", "web/*.mjs", "web/*.css", "laya_reference_examples.json"]

[tool.setuptools.packages.find]
include = ["sigid*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
